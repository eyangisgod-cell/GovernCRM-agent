# GovernCRM 策略评测标注基准 v1.3
# 冻结日期: 2026-10-25（v1.2 于 2026-10-24 冻结；v1.3 = 5 条边界样本逐条拍板后的定稿）
# rule_version: "2026-10-26.frozen"
# 标注纪律: 本文件先于 policy_kernel 入库。CI 用本文件对照内核输出，一致率须 100%。
# 生产方式: AI 起草 (按 GovernCRM_附录D_冻结版.md) → eyangisgod 逐条拍板（2026-10-25）
# 5 条边界样本(*) 期望值已由 eyangisgod 逐条确认（2026-10-25）

# ─── 分层口径（裁决 #11，用于校验 global_segment / platform_segment 字段）───
# 消费金额档: high(≥500) / mid(100-500) / low(<100)
# 最近购买档: recent(≤30天) / mid(31-90天) / stale(>90天)
# 九宫格 = 金额档 × 近度档，各层有 rule_id
#
# global_segment / platform_segment 字段填九宫格层名（如 "amount_mid_recent"），
# 而非 "高/中/低"。规则3键①按平台局部层名比较：amount > mid_amount > recent >
# ... 实际比较规则：见下方 layers.partial_order。
#
# 层间优先级（"更高层级 = 对客户更有价值"，裁决 #14）：
#   第一维 金额档: high(3) > mid(2) > low(1)
#   第二维 近度档: recent(3) > mid(2) > stale(1)
#   合成层级分 = 金额档分 * 10 + 近度档分（11..33），数值大者层级更高
layers:
  partial_order: "layer_score = amount_score * 10 + recency_score"
  amount_score: {high: 3, mid: 2, low: 1}
  recency_score: {recent: 3, mid: 2, stale: 1}

# ─── 净值折算（规则 5，附录D 冻结版）───
# net_value = max(0, coupon_value - max(0, coupon_threshold - customer_avg_order_value_90d))
net_value:
  formula: "max(0, coupon_value - max(0, coupon_threshold - customer_avg_order_value_90d))"
  floor: 0
  window_days: 90

# ─── 抑制红线阈值（规则 1a）───
# SUP_HIGH_REFUND 不做 2σ 统计（MVP 无历史样本、统计口径不可复现），改用固定阈值常量。
thresholds:
  complaint_window_days: 90
  refund_rate_threshold: 0.20          # 退款率 > 0.20 判定命中
  refund_dispute_window_days: 90      # 近 90 天存在纠纷亦命中
  high_value_percentile: 1.0           # 消费金额 Top 1%
  freq_window_days: 7
  freq_max_touches: 2
  channel_cooldown_hours: 72
  conflict_window_hours: 72

# ─── 时间锚点（所有"距今"判定的基准，缺省则不可复现）───
now: "2026-10-23T12:00:00Z"

