# GovernCRM 本地开发环境（Wave 0 / T0.1）
#
# 范围：**只有数据库**。API 服务在 T-F1（T-F1 API 契约冻结）阶段随契约一并接入，
#       避免骨架阶段出现"能起但没契约"的假完成。
#
# 存储决策（架构 v5.2 §3.7）：PostgreSQL 16 + pgvector 三合一
#   —— 关系 + `SKIP LOCKED` 队列 + 向量。
#   **不装独立向量库、不装 Redis**：缓存 = PG 表 + 进程内 LRU。
#
# 端口 / 账号 / 口令：全部来自根目录 `.env`（由 `.env.example` 复制而来，只含占位符）。
# 本文件里的默认值仅用于本地开发，**不是生产口令**。

name: governcrm

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: governcrm-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-governcrm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-governcrm_dev_only}
      POSTGRES_DB: ${POSTGRES_DB:-governcrm}
      # 让容器内的 `psql` 默认连到本项目库（验收命令 `docker compose exec db psql -c ...` 可直接用）
      PGUSER: ${POSTGRES_USER:-governcrm}
      PGDATABASE: ${POSTGRES_DB:-governcrm}
      # 显式指定 PGDATA 子目录，便于挂载卷时避开 postgres 用户权限问题
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # 持久卷：容器重建不丢数据
      - pgdata:/var/lib/postgresql/data
      # 初始化脚本：**仅在数据卷为空时执行一次**
      # 只做扩展启用（vector），业务表由 migrations/ 下的原始 SQL 管理（T0.2 唯一写者）
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-governcrm} -d ${POSTGRES_DB:-governcrm}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    command:
      ["postgres", "-c", "shared_buffers=256MB", "-c", "max_connections=100"]

volumes:
  pgdata:
    name: governcrm-pgdata
