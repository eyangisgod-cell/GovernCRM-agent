# ============================================================================
# governance.yaml —— 策略参数唯一来源（种子配置）
# ============================================================================
#
# 权威源：docs/specs/GovernCRM_技术架构方案_v5.2.md:623-642（§10.1 种子规格）
#         docs/specs/GovernCRM_附录D_冻结版.md（规则语义，冻结不可改）
#         docs/specs/评测标注基准_v1.3.yaml（thresholds 块数值来源）
#
# 纪律：
#   1. 本文件是策略参数的**唯一来源**，代码里不得再写一份阈值常量。
#   2. `thresholds` 块与 `docs/specs/评测标注基准_v1.3.yaml` 的 `thresholds` 块
#      **逐项相等**，由 tests/policy/test_governance_config.py 的一致性测试强制；
#      两处必须同改，单改一处会让测试红。
#   3. 任何变更走审批 + 回归门禁（与代码同级），变更写审计（rule_version 递增）。
#      FR-17 策略工作台 v0.2 才做；MVP 用本 YAML + 完整审批链路。
#   4. **抑制红线参数不可被员工级策略包覆盖**（FR-01b）：
#      覆盖即被 `policy_kernel.apply_overrides()` 拒绝并报可操作错误。
#   5. 不含任何真实密钥 / 口令。
#
# 变更记录：
#   1.0.0  2026-10-25  T0.4 初始种子。阈值抄录自 评测标注基准_v1.3.yaml，未手改。
#
# ============================================================================

version: "1.0.0"
updated_at: "2026-10-25"

# ---------------------------------------------------------------------------
# 一、抑制红线与频控阈值
#
# 本块与 评测标注基准_v1.3.yaml 的 thresholds 块**逐项相等**（一致性测试强制）。
# 语义见附录D 规则 1（四红线）/ 规则 1b（NO_CONSENT）/ 规则 2（频控）/ 规则 3（冲突窗口）。
#
# 注：SUP_HIGH_REFUND 用**固定阈值常量**，**不做 2σ 统计**——MVP 无足够样本，
#     且统计口径不可复现（prd.md §1 末注）。
# ---------------------------------------------------------------------------
thresholds:
  complaint_window_days: 90          # SUP_HIGH_COMPLAINT：近 90 天投诉 ≥1 即 DENY
  refund_rate_threshold: 0.20        # SUP_HIGH_REFUND：退款率 > 0.20 判定命中
  refund_dispute_window_days: 90     # SUP_HIGH_REFUND：近 90 天存在纠纷亦命中
  high_value_percentile: 1.0         # SUP_HIGH_VALUE：消费金额 Top 1%，仅转人工，不自动触达
  freq_window_days: 7                # 规则 2：7 天滚动窗口
  freq_max_touches: 2                # 规则 2：全平台合计触达 ≤2 次
  channel_cooldown_hours: 72         # 规则 2：同一通道两次触达间隔 ≥72h
  conflict_window_hours: 72          # 规则 3：同一 72h 窗口内多平台候选冲突

# ---------------------------------------------------------------------------
# 二、九宫格分层阈值（附录D 规则 4 层级比较式）
#
#   layer_score = amount_score × 10 + recency_score   → 取值 11..33，大者层级高
#
# 全局层 + 平台局部层各一套（FR-16）。键①「平台局部层级」是冲突排序第一键。
# ---------------------------------------------------------------------------
segmentation:
  layer_score_base: 10               # 乘数：layer_score = amount_score * layer_score_base + recency_score
  amount:
    high_min_cents: 50000            # ≥500 元 = high = 3
    mid_min_cents: 10000             # 100–500 元 = mid = 2（<100 元 = low = 1）
  recency:
    recent_max_days: 30              # ≤30 天 = recent = 3
    mid_max_days: 90                 # 31–90 天 = mid = 2（>90 天 = stale = 1）

# ---------------------------------------------------------------------------
# 三、冲突消解（附录D 规则 3 + 规则 6）
#
# 三键排序：① 平台局部 layer_score（高者胜）② 权益净值（高者胜）③ 创建时间（早者胜）
# `platform_priority_overrides` **最高优先**：显式配置的平台覆盖三键；
# 未配置的平台才走三键。三键全平 → 升级人工（规则 6，ESCALATE_HUMAN），不默认放行。
# ---------------------------------------------------------------------------
conflict_resolution:
  tie_break_order:                   # 三键，按优先级排列，顺序不可改
    - platform_layer_score
    - benefit_net_value
    - created_at_earliest
  platform_priority_overrides: {}    # 数值小者优先；未列出的平台走三键。示例：{taobao: 10, wechat_moments: 20}

# ---------------------------------------------------------------------------
# 四、权益净值折算（附录D 规则 5）
#
#   net = max(0, 面额 − max(0, 门槛 − 近 90 天客单价))
#
# 多候选取净值高者。净值下限 0。此式是「对客户更有利」的量化定义。
# ---------------------------------------------------------------------------
benefit:
  formula: "max(0, face_value - max(0, threshold - avg_order_value_90d))"
  floor: 0

# ---------------------------------------------------------------------------
# 五、审批路由三档 + 超时策略（裁决 #25）
#
# 影响面 = 批次涵盖客户数。**超时自动失效，不默认通过**（E9）；
# 剩余 24h 升级提醒上一级。知会 = 只读通知，不参与签署。
# ---------------------------------------------------------------------------
approval:
  impact_tiers:
    single_sign_max: 10              # ≤10 → 运营负责人单签
    dual_sign_max: 100               # 11–100 → 负责人 + 管理员双签
    # >100 → 双签 + 合规知会
  timeout_hours: 48                  # 48h 自动失效（不默认通过）
  escalate_remind_hours_before: 24   # 剩余 24h 升级提醒

# ---------------------------------------------------------------------------
# 六、预算（裁决 #27）
#
# 单任务 = 50 万 Token 或 ¥20（先到为准）；单数字员工日 = ¥200。
# 超限按 E11：停止当前任务 + 告警 + 审计。金额阈值以国内模型单价为基准，
# 境外模型按实际单价重标。
# ---------------------------------------------------------------------------
budget:
  per_task_token_limit: 500000
  per_task_amount_cents: 2000        # ¥20
  per_worker_daily_amount_cents: 20000  # ¥200
  currency: "CNY"

# ---------------------------------------------------------------------------
# 七、蒸馏阈值（裁决 #10）
# ---------------------------------------------------------------------------
distillation:
  min_success_count: 3               # 同一动作模式成功执行 N=3 次触发轻量蒸馏

# ---------------------------------------------------------------------------
# 八、自主度（裁决 #5）—— MVP 只开放 L0 + L1
# ---------------------------------------------------------------------------
autonomy:
  mvp_allowed_levels: ["L0", "L1"]   # L1 全审批、无白名单豁免；L2/L3 随 v0.2
