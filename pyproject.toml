[project]
name = "governcrm"
version = "0.0.1"
description = "GovernCRM —— 电商客户盘活治理平台（模拟数据 MVP）"
readme = "README.md"
requires-python = ">=3.11,<3.14"
# 说明：MVP 阶段不构建/不发布 wheel，仓库为 virtual project。
# `src` 是顶层包（`from src.policy.kernel import ...`），由 pytest `pythonpath = ["."]` 与仓库根目录保证可导入。
dependencies = []

# ---------------------------------------------------------------------------
# uv 三档依赖组（PEP 735 dependency-groups）
#   runtime    —— 应用运行时依赖
#   dev        —— 开发工具链（ruff / mypy / pytest），uv 默认启用
#   evaluation —— 评测依赖（inspect_ai），仅评测/CI 使用
#
# 纪律：依赖白名单制——本文件以外的第三方库一律禁止 import。
#       落地：`ruff.toml`（TID251）+ `scripts/check_dependencies.py`（全量白名单扫描）。
#       新增任何第三方库前，必须先完成 LICENSE 核对并记入 `LICENSES.md`。
# ---------------------------------------------------------------------------
[dependency-groups]
runtime = [
    "fastapi>=0.119.0",           # API 框架（架构 v5.2 §3.7）
    "uvicorn[standard]>=0.30.0",  # ASGI 服务器
    "pydantic>=2.9.0",            # 数据模型与类型注解
    "pydantic-settings>=2.5.0",   # 配置与开关读取（含出境开关默认值）
    "sqlalchemy>=2.0.30",         # 仓储层 ORM（迁移仍走原始 SQL）
    "psycopg[binary]>=3.2.0",     # PostgreSQL 16 驱动
    "pgvector>=0.3.0",            # pgvector Python 绑定（复用 PG，不引独立向量库）
    "langgraph>=1.0.0",           # 执行循环编排（MIT）
    "langchain-core>=1.0.0",      # LangGraph 依赖的模型/工具基础类型
    "litellm>=1.106.0",           # Provider 聚合层（仅 src/providers/ 可 import，见 N4 拍板 B）
    "pyyaml>=6.0.0",              # governance.yaml 读取（策略参数唯一来源）
    "httpx>=0.27.0",              # 对外 HTTP 客户端
]

dev = [
    "ruff>=0.6.0",                # lint + format
    "mypy>=1.11.0",               # 类型检查
    "pytest>=8.0.0",              # 测试
    "pytest-cov>=5.0.0",          # 覆盖率
    "pytest-asyncio>=0.24.0",     # 异步用例
    "types-pyyaml>=6.0.0",        # 类型存根
]

evaluation = [
    "inspect-ai>=0.3.100",        # Agent 轨迹评测（dev-only，锁版本见 LICENSES.md）
]

[tool.uv]
# 不把本项目构建为可发布包；依赖只用于本地/CI。
package = false
# uv 默认只装 `dev` 组；本项目要求 runtime / dev / evaluation 三档一次装齐，
# 否则本地 `uv run` 会缺 runtime 依赖（典型的"骨架看起来能跑、实际 ImportError"陷阱）。
default-groups = ["runtime", "dev", "evaluation"]

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
# 默认不跑需要真 PostgreSQL 的用例；`make pg-test` 显式跑 `-m pg`。
addopts = ["-m", "not pg"]
markers = [
    "unit: 纯函数单测（零外部依赖，默认进 CI）",
    "integration: 集成测试（需外部服务）",
    "pg: 需要真 PostgreSQL 的用例（append-only 触发器 / 哈希链 / CHECK 约束）",
]
filterwarnings = ["default"]

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
mypy_path = "."
files = ["src", "tests", "scripts"]
strict = true
warn_unreachable = true
warn_unused_configs = true
# 第三方库未提供类型存根时忽略，不放宽自身代码的类型要求
ignore_missing_imports = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_reexport = true
